# 6 normalized HBM4-width + 2 HBF stacks (288 + 1024 GiB).
# Exploratory simulator profile; see configs/parameter-provenance.json.
# Per-stack D2D bandwidth from the TCAD architecture model, not a Sandisk
# measurement. The source gives no extra fixed latency, so this adds none.
base-die-link-read-bw=2048
base-die-link-write-bw=512
base-die-link-latency-ns=0

# ---- Shipping-2026 HBM4 profile: 9.6 Gb/s/pin over 2048 DQ gives
# ---- 2457.6 GB/s per stack, between the 8 Gb/s reference point and the
# ---- >11 Gb/s vendor bin. See parameter-provenance.json.
hbm-stacks=6
hbm-capacity-bytes=309237645312
hbm-channels=32
hbm-pseudo-channels=2
hbm-bank-groups-per-pseudo-channel=16
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-channel-width-bits=64
hbm-burst-length=8
hbm-pin-rate-gbps=9.6
hbm-data-rate-per-command-clock=4
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
hbm-refresh=true
hbm-same-bank-refresh=true
hbm-trefi-ns=3900
hbm-trfc-ns=350
hbm-trfcsb-ns=160
hbm-trrefd-ns=10
# Absolute core/turnaround minima are exploratory and round up to CK edges.
hbm-address-mapping-ns=0
hbm-trcdrd-ns=14
hbm-trcdwr-ns=14
hbm-tcl-ns=14
hbm-tcwl-ns=10
hbm-trp-ns=14
hbm-tras-ns=32
hbm-trc-ns=46
hbm-twr-ns=15
hbm-trtp-ns=7.5
hbm-trrd-s-ns=4
hbm-trrd-l-ns=6
hbm-tfaw-ns=20
hbm-twtr-s-ns=4
hbm-twtr-l-ns=8
hbm-trtw-ns=8

# ---- HBF profile: the geometry computes 512 GiB and read interface is
# ---- 1600 GB/s per stack. Sandisk publishes 512 GB decimal, 16 dies and
# ---- 1.6 TB/s; internal topology and the GiB geometry are assumptions.
# FMS 2026 confirms UCIe as the processor connection. This is a technology
# label; public material does not disclose version, lanes, or protocol timing.
hbf-processor-interconnect=ucie
hbf-stacks=2
hbf-channels=4
hbf-dies-per-channel=4
hbf-planes-per-die=4
hbf-blocks-per-plane=8192
hbf-pages-per-block=256
hbf-page-size=4096
hbf-oob-bytes=224
hbf-media-lanes-per-plane=16
hbf-subarrays-per-plane=32
hbf-page-buffer-banks-per-plane=16
hbf-read-ns=1000
hbf-program-ns=95000
hbf-program-verify-ns=5000
hbf-erase-ns=2000000
hbf-ecc-decode-latency-ns=250
hbf-ecc-encode-latency-ns=250
# 1600 GB/s HBIO is decoded payload. ECC/channel carry the 4320 B page+OOB
# codeword; the shared TSV also carries one 64 B command per page.
hbf-ecc-decode-raw-bw=105.46875
hbf-ecc-encode-raw-bw=105.46875
hbf-channel-bw=421.875
hbf-hbio-bw=1600
hbf-tsv-bw=1712.5
hbf-media-lane-bw=2048
hbf-page-buffer-bw=2048
# Controller DRAM defaults to the full-resident L2P plus configured write buffer. Lookups
# use a pipelined 1 ns issue slot with a 100 ns response.
hbf-page-run-acceleration=true

hbf-gc-low-watermark-pages=4096
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-gc-wear-leveling-weight=0.05

hbf-write-coalescing=true
hbf-write-buffer-completion-requires-flush=false
hbf-write-buffer-pages=1024
hbf-write-buffer-flush-threshold-pages=512

# Stack thermal model (core device property): one lumped RC node per stack
# plus a firmware pacing governor. Media reads/programs/erases deposit
# energy; the node decays toward ambient + static-power * resistance; above
# the throttle threshold the controller paces media admissions at the
# sustainable power budget until the node cools below the release
# threshold. Array timings never change - throttling delays command issue,
# as real firmware does. Boot is the idle steady state (~50 C), so short
# windows from cold are numerically unaffected; the fixed-footprint
# experiment opts its HBF rows into the serving steady-state boundary with
# overlays/hbf/thermal-steady-state-start.cfg. No public HBF thermal or
# per-bit energy specification exists: every value is an exploratory
# assumption registered in configs/parameter-provenance.json. The derived
# pacing budget (85 - 45) / 2.5 - 2 = 14 W with 6 pJ/bit reads implies
# ~292 GB/s sustainable per-stack read bandwidth, between the ~200 GB/s
# thermal ceiling argued by arXiv 2608.11668 and the 1.6 TB/s interface
# claim; sweep hbf-thermal-read-energy-pj-per-bit or
# hbf-thermal-throttle-power-w to cover that dispute.
hbf-thermal-enable=true
hbf-thermal-ambient-c=45
hbf-thermal-resistance-c-per-w=2.5
hbf-thermal-capacitance-j-per-c=3.0
hbf-thermal-throttle-c=85
hbf-thermal-release-c=80
hbf-thermal-static-power-w=2.0
hbf-thermal-read-energy-pj-per-bit=6.0
hbf-thermal-program-energy-pj-per-bit=60.0
hbf-thermal-erase-energy-uj-per-block=150.0
hbf-thermal-throttle-power-w=0
