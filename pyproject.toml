[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbserve"
version = "0.1.0a1"
description = "Evidence-aware, request-driven LLM serving memory workload compiler"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["llm", "serving", "workload", "memory", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.scripts]
hbserve = "hbserve.__main__:main"

[project.urls]
Repository = "https://github.com/Systems-and-Memory-Lab/HBServe"
Issues = "https://github.com/Systems-and-Memory-Lab/HBServe/issues"

[tool.setuptools.packages.find]
include = ["hbserve*", "hbfsim_client*"]
exclude = ["tests*"]
